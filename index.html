
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">

    <title>Personal Nutrition Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header class="app-header">
        <div>
            <h1>Nutrition Tracker</h1>
            <p>Personal Health & Fitness Dashboard</p>
        </div>

        <div id="today-date"></div>
    </header>

    <!-- DASHBOARD -->
    <section id="dashboard-page" class="page active">
        <div id="dashboard"></div>
    </section>

    <!-- NUTRITION -->
    <section id="nutrition-page" class="page">
        <div id="nutrition"></div>
    </section>

    <!-- FOOD DATABASE -->
    <section id="foods-page" class="page">
        <div id="foods"></div>
    </section>

    <!-- WORKOUT -->
    <section id="workout-page" class="page">
        <div id="workout"></div>
    </section>

    <!-- CARDIO -->
    <section id="cardio-page" class="page">
        <div id="cardio"></div>
    </section>

    <!-- PROGRESS -->
    <section id="progress-page" class="page">
        <div id="progress"></div>
    </section>

    <!-- WEIGHT -->
    <section id="weight-page" class="page">
        <div id="weight"></div>
    </section>

    <!-- WATER -->
    <section id="water-page" class="page">
        <div id="water"></div>
    </section>

    <!-- SETTINGS -->
    <section id="settings-page" class="page">
        <div id="settings"></div>
    </section>

</div>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">

    <button class="nav-btn active" data-page="dashboard">
        <span>⌂</span>
        <small>หน้าหลัก</small>
    </button>

    <button class="nav-btn" data-page="nutrition">
        <span>🍽️</span>
        <small>อาหาร</small>
    </button>

    <button class="nav-btn" data-page="workout">
        <span>🏋️</span>
        <small>Workout</small>
    </button>

    <button class="nav-btn" data-page="cardio">
        <span>🏃</span>
        <small>Cardio</small>
    </button>

    <button class="nav-btn" data-page="progress">
        <span>📊</span>
        <small>สถิติ</small>
    </button>

    <button class="nav-btn" data-page="settings">
        <span>⚙️</span>
        <small>ตั้งค่า</small>
    </button>

</nav>

<!-- DATABASE AND APPLICATION -->
<script src="foods.js"></script>
<script src="app.js"></script>

</body>
</html>
